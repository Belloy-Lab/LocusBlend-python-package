[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "locusblend"
version = "0.1.0.dev0"
description = "Reusable core for LocusBlend: multi-index regional visualization of GWAS signals"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["gwas", "locus-zoom", "linkage-disequilibrium", "visualization"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Only what the extracted, Streamlit-independent code actually imports.
# Streamlit is deliberately NOT a dependency of this package.
dependencies = [
    "numpy",
    "pandas",
    "plotly",
]

[project.optional-dependencies]
# Static PNG/PDF export helpers (export.py).
export = ["pillow", "kaleido"]
# Parquet gene tables (genes.py: load_gene_table).
genes = ["pyarrow"]
# Recombination-rate BigWig overlay (plotting.py: _read_recomb_track_bw).
recomb = ["pyBigWig"]
dev = ["pytest"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

